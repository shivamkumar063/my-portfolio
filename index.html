<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem("color-scheme");
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (stored === "dark") {
            meta.content = "dark";
            document.documentElement.classList.add("dark");
          } else if (stored === "light") {
            meta.content = "light";
            document.documentElement.classList.remove("dark");
          } else {
            meta.content = "light dark";
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.remove("dark");
            }
          }
        } catch (e) {}
      })();
    </script>

    <title>Shivam Kumar — Electronics Engineer</title>
    <meta name="description" content="Portfolio of Shivam Kumar, Electronics Engineer passionate about embedded system, Industrial automation and Emerging technologies. I build practical engineering solution by combining electronics, programming and innovation" />
